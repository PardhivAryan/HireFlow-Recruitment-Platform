name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Auth PostgreSQL
  AUTH_POSTGRES_USER: hireflow_auth
  AUTH_POSTGRES_PASSWORD: ci_auth_password
  AUTH_POSTGRES_DB: hireflow_auth
  AUTH_POSTGRES_HOST: 127.0.0.1
  AUTH_POSTGRES_PORT: 5433

  # Auth
  AUTH_JWT_SECRET: ci-auth-jwt-secret-12345678901234567890
  AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: 30
  RECRUITER_CREATION_SECRET: ci-recruiter-secret-12345678901234567890

  # Recruitment PostgreSQL
  RECRUITMENT_POSTGRES_USER: hireflow_recruitment
  RECRUITMENT_POSTGRES_PASSWORD: ci_recruitment_password
  RECRUITMENT_POSTGRES_DB: hireflow_recruitment
  RECRUITMENT_POSTGRES_HOST: 127.0.0.1
  RECRUITMENT_POSTGRES_PORT: 5434

  # Interview PostgreSQL
  INTERVIEW_POSTGRES_USER: hireflow_interview
  INTERVIEW_POSTGRES_PASSWORD: ci_interview_password
  INTERVIEW_POSTGRES_DB: hireflow_interview
  INTERVIEW_POSTGRES_HOST: 127.0.0.1
  INTERVIEW_POSTGRES_PORT: 5435

  # Service communication
  INTERVIEW_SERVICE_URL: http://127.0.0.1:8003
  INTERNAL_SERVICE_SECRET: ci-internal-service-secret-123456789012345

  # Redis
  REDIS_URL: redis://127.0.0.1:6379/0
  AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/0

  # Test DB URLs
  AUTH_TEST_DATABASE_URL: postgresql+psycopg://hireflow_auth:ci_auth_password@127.0.0.1:5433/hireflow_auth

  RECRUITMENT_TEST_DATABASE_URL: postgresql+psycopg://hireflow_recruitment:ci_recruitment_password@127.0.0.1:5434/hireflow_recruitment

  INTERVIEW_TEST_DATABASE_URL: postgresql+psycopg://hireflow_interview:ci_interview_password@127.0.0.1:5435/hireflow_interview

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Start PostgreSQL and Redis
        run: |
          docker compose up -d --wait \
            auth-db \
            recruitment-db \
            interview-db \
            redis

      - name: Install Auth dependencies
        run: |
          python -m pip install -r auth-service/requirements-dev.txt

      - name: Run Auth tests
        working-directory: auth-service
        run: python -m pytest -q

      - name: Install Recruitment dependencies
        run: |
          python -m pip install -r recruitment-service/requirements-dev.txt

      - name: Run Recruitment tests
        working-directory: recruitment-service
        run: python -m pytest -q

      - name: Install Interview dependencies
        run: |
          python -m pip install -r interview-service/requirements-dev.txt

      - name: Run Interview tests
        working-directory: interview-service
        run: python -m pytest -q

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build FastAPI Docker images
        run: |
          docker compose build \
            auth-service \
            recruitment-service \
            interview-service

      - name: Clean up
        if: always()
        run: docker compose down -v
